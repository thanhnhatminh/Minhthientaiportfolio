<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nguyễn Thanh Nhật Minh | Portfolio</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --forest: #4F6656;
      --sage: #73AFA3;
      --leaf: #538666;
      --mist: #7BBFD8;
      --water: #298DB5;
      --deep: #1A3E6C;
      --cream: #F7FBFA;
      --text: #183B45;
    }

    * {
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--text);
      font-family: "Montserrat", sans-serif;
      background:
        radial-gradient(circle at 8% 4%, rgba(123,191,216,.35), transparent 24rem),
        radial-gradient(circle at 92% 18%, rgba(115,175,163,.20), transparent 25rem),
        var(--cream);
    }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    .topbar {
      position: absolute;
      top: 26px;
      left: 50%;
      width: min(1120px, calc(100% - 40px));
      display: flex;
      justify-content: flex-end;
      transform: translateX(-50%);
      z-index: 10;
    }

    .languages {
      display: flex;
      gap: 6px;
      padding: 5px;
      border: 1px solid rgba(26,62,108,.12);
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      box-shadow: 0 8px 20px rgba(26,62,108,.08);
      backdrop-filter: blur(8px);
    }

    .language-btn {
      padding: 8px 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--forest);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .language-btn.active {
      color: white;
      background: var(--deep);
    }

    .hero {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      align-items: center;
      gap: 64px;
      padding: 100px 0 72px;
    }

    .eyebrow {
      margin: 0;
      color: var(--water);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 16px 0;
      color: var(--deep);
      font-size: clamp(44px, 6vw, 82px);
      line-height: .98;
      letter-spacing: -3px;
    }

    .subtitle {
      color: var(--forest);
      font-size: clamp(16px, 2vw, 20px);
      font-weight: 600;
      line-height: 1.6;
    }

    .intro {
      max-width: 655px;
      margin-top: 24px;
      font-size: 14px;
      line-height: 1.95;
    }

    .line {
      width: 84px;
      height: 4px;
      margin: 30px 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--leaf), var(--mist), var(--water));
    }

    .photo-wrap {
      position: relative;
      min-height: 480px;
      display: grid;
      place-items: center;
    }

    .photo-bg {
      position: absolute;
      width: min(420px, 88%);
      aspect-ratio: 1 / 1.13;
      border-radius: 48% 52% 42% 58% / 47% 43% 57% 53%;
      background: linear-gradient(145deg, var(--sage), var(--water));
      transform: rotate(7deg);
    }

    .profile-photo {
      position: relative;
      z-index: 1;
      width: min(360px, 78%);
      aspect-ratio: 3 / 4;
      object-fit: cover;
      object-position: center;
      border: 8px solid rgba(255,255,255,.76);
      border-radius: 180px 180px 32px 32px;
      box-shadow: 0 24px 50px rgba(26,62,108,.25);
    }

    .quote {
      position: absolute;
      z-index: 2;
      right: 0;
      bottom: 28px;
      max-width: 180px;
      padding: 16px;
      color: var(--deep);
      border-radius: 16px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 12px 30px rgba(26,62,108,.12);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.65;
    }

    .section {
      padding: 104px 0;
    }

    .section-title {
      margin: 12px 0 14px;
      color: var(--deep);
      font-size: clamp(30px, 4vw, 46px);
      letter-spacing: -1.5px;
    }

    .section-lead {
      max-width: 720px;
      margin: 0;
      line-height: 1.85;
    }

    .timeline {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-top: 48px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      top: 41px;
      right: 10%;
      left: 10%;
      height: 2px;
      background: linear-gradient(90deg, var(--forest), var(--mist), var(--water), var(--deep));
    }

    .year-btn {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      min-height: 166px;
      padding: 0 10px;
      border: 0;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      text-align: center;
      cursor: pointer;
    }

    .year-dot {
      width: 84px;
      height: 84px;
      display: grid;
      place-items: center;
      border: 7px solid var(--cream);
      border-radius: 50%;
      background: var(--sage);
      color: white;
      box-shadow: 0 5px 14px rgba(26,62,108,.16);
      font-size: 17px;
      font-weight: 800;
      transition: .25s ease;
    }

    .year-btn:nth-child(2) .year-dot { background: var(--leaf); }
    .year-btn:nth-child(3) .year-dot { background: var(--water); }
    .year-btn:nth-child(4) .year-dot { background: var(--deep); }

    .year-btn:hover .year-dot,
    .year-btn.active .year-dot {
      transform: translateY(-8px) scale(1.07);
    }

    .year-summary {
      font-size: 11px;
      font-weight: 500;
      line-height: 1.65;
    }

    .year-detail {
      min-height: 112px;
      margin-top: 36px;
      padding: 28px 30px;
      border-left: 5px solid var(--water);
      border-radius: 0 18px 18px 0;
      background: white;
      box-shadow: 0 12px 30px rgba(26,62,108,.08);
      line-height: 1.85;
    }

    .year-detail strong {
      color: var(--deep);
    }

    .contact-box {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 30px;
      padding: clamp(30px, 5vw, 56px);
      border-radius: 30px;
      color: white;
      background: linear-gradient(135deg, var(--deep), var(--water));
    }

    .contact-box h2 {
      margin: 0 0 12px;
      font-size: clamp(30px, 4vw, 44px);
      letter-spacing: -1.5px;
    }

    .contact-box p {
      max-width: 590px;
      margin: 0;
      color: rgba(255,255,255,.9);
      font-size: 14px;
      line-height: 1.9;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .links a {
      padding: 13px 18px;
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 999px;
      color: white;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      transition: .2s ease;
    }

    .links a:hover {
      color: var(--deep);
      background: white;
    }

    footer {
      padding: 42px 0 52px;
      color: var(--forest);
      font-size: 12px;
      line-height: 1.9;
      text-align: center;
    }

    @media (max-width: 760px) {
      .topbar { top: 16px; }

      .hero {
        grid-template-columns: 1fr;
        gap: 24px;
        padding-top: 90px;
      }

      .photo-wrap {
        min-height: 380px;
        grid-row: 1;
      }

      .quote { right: 4%; }

      .timeline {
        grid-template-columns: repeat(2, 1fr);
        gap: 24px 10px;
      }

      .timeline::before { display: none; }

      .contact-box { grid-template-columns: 1fr; }

      .links { align-items: stretch; }
    }
  </style>
</head>

    yearButtons.forEach((button) => {
      button.addEventListener("click", () => {
        yearButtons.forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        currentYear = button.dataset.year;
        renderYearDetail();
      });
    });

    languageButtons.forEach((button) => {
      button.addEventListener("click", () => {
        languageButtons.forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        currentLanguage = button.dataset.lang;
        renderPage();
      });
    });

    renderPage();
  </script>
</body>
</html>
