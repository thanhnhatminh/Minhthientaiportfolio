<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nguyễn Thanh Nhật Minh | Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --forest: #4F6656;
      --sage: #73AFA3;
      --leaf: #538666;
      --mist: #7BBFD8;
      --water: #298DB5;
      --deep: #1A3E6C;
      --cream: #F7FBFA;
      --text: #183B45;
    }

    * {
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--text);
      font-family: "Montserrat", sans-serif;
      background:
        radial-gradient(circle at 8% 4%, rgba(123,191,216,.35), transparent 24rem),
        radial-gradient(circle at 92% 18%, rgba(115,175,163,.20), transparent 25rem),
        var(--cream);
    }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    .topbar {
      position: absolute;
      top: 26px;
      left: 50%;
      width: min(1120px, calc(100% - 40px));
      display: flex;
      justify-content: flex-end;
      transform: translateX(-50%);
      z-index: 10;
    }

    .languages {
      display: flex;
      gap: 6px;
      padding: 5px;
      border: 1px solid rgba(26,62,108,.12);
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      box-shadow: 0 8px 20px rgba(26,62,108,.08);
      backdrop-filter: blur(8px);
    }

    .language-btn {
      padding: 8px 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--forest);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .language-btn.active {
      color: white;
      background: var(--deep);
    }

    .hero {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      align-items: center;
      gap: 64px;
      padding: 100px 0 72px;
    }

    .eyebrow {
      margin: 0;
      color: var(--water);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 16px 0;
      color: var(--deep);
      font-size: clamp(42px, 4.5vw, 68px);
      line-height: .98;
      letter-spacing: -3px;
    }

    .name span {
      display: block;
      white-space: nowrap;
    }

    .subtitle {
      color: var(--forest);
      font-size: clamp(16px, 2vw, 20px);
      font-weight: 600;
      line-height: 1.6;
    }

    .intro {
      max-width: 655px;
      margin-top: 24px;
      font-size: 14px;
      line-height: 1.95;
    }

    .line {
      width: 84px;
      height: 4px;
      margin: 30px 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--leaf), var(--mist), var(--water));
    }

    .photo-wrap {
      position: relative;
      min-height: 480px;
      display: grid;
      place-items: center;
    }

    .photo-bg {
      position: absolute;
      width: min(420px, 88%);
      aspect-ratio: 1 / 1.13;
      border-radius: 48% 52% 42% 58% / 47% 43% 57% 53%;
      background: linear-gradient(145deg, var(--sage), var(--water));
      transform: rotate(7deg);
    }

    .profile-photo {
      position: relative;
      z-index: 1;
      width: min(360px, 78%);
      aspect-ratio: 3 / 4;
      object-fit: cover;
      object-position: center;
      border: 8px solid rgba(255,255,255,.76);
      border-radius: 180px 180px 32px 32px;
      box-shadow: 0 24px 50px rgba(26,62,108,.25);
    }

    .quote {
      position: absolute;
      z-index: 2;
      right: 0;
      bottom: 28px;
      max-width: 180px;
      padding: 16px;
      color: var(--deep);
      border-radius: 16px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 12px 30px rgba(26,62,108,.12);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.65;
    }

    .section {
      padding: 104px 0;
    }

    .section-title {
      margin: 12px 0 14px;
      color: var(--deep);
      font-size: clamp(30px, 4vw, 46px);
      letter-spacing: -1.5px;
    }

    .section-lead {
      max-width: 720px;
      margin: 0;
      line-height: 1.85;
    }

    .timeline {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-top: 48px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      top: 41px;
      right: 10%;
      left: 10%;
      height: 2px;
      background: linear-gradient(90deg, var(--forest), var(--mist), var(--water), var(--deep));
    }

    .year-btn {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      min-height: 166px;
      padding: 0 10px;
      border: 0;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      text-align: center;
      cursor: pointer;
    }

    .year-dot {
      width: 84px;
      height: 84px;
      display: grid;
      place-items: center;
      border: 7px solid var(--cream);
      border-radius: 50%;
      background: var(--sage);
      color: white;
      box-shadow: 0 5px 14px rgba(26,62,108,.16);
      font-size: 17px;
      font-weight: 800;
      transition: .25s ease;
    }

    .year-btn:nth-child(2) .year-dot { background: var(--leaf); }
    .year-btn:nth-child(3) .year-dot { background: var(--water); }
    .year-btn:nth-child(4) .year-dot { background: var(--deep); }

    .year-btn:hover .year-dot,
    .year-btn.active .year-dot {
      transform: translateY(-8px) scale(1.07);
    }

    .year-summary {
      font-size: 11px;
      font-weight: 500;
      line-height: 1.65;
    }

    .year-detail {
      min-height: 112px;
      margin-top: 36px;
      padding: 28px 30px;
      border-left: 5px solid var(--water);
      border-radius: 0 18px 18px 0;
      background: white;
      box-shadow: 0 12px 30px rgba(26,62,108,.08);
      line-height: 1.85;
    }

    .year-detail strong {
      color: var(--deep);
    }

    .year-detail.is-hidden {
      display: none;
    }

    .visual-river {
      display: grid;
      grid-template-columns: 1.15fr .8fr 1.15fr;
      gap: 18px;
      margin: 0 0 32px;
    }

    .visual-card {
      height: 285px;
      margin: 0;
      overflow: hidden;
      border-radius: 28px;
      box-shadow: 0 18px 38px rgba(26,62,108,.14);
    }

    .visual-card:nth-child(1) { margin-top: 32px; }
    .visual-card:nth-child(3) { margin-top: 58px; }

    .visual-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .55s ease;
    }

    .visual-card:hover img { transform: scale(1.06); }
    .visual-card.portrait img { object-position: center 34%; }

    .contact-box {
      position: relative;
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      align-items: center;
      gap: 54px;
      padding: clamp(30px, 5vw, 56px);
      border-radius: 30px;
      color: white;
      background: linear-gradient(135deg, var(--deep), var(--water));
      overflow: hidden;
    }

    .contact-box::after {
      content: "";
      position: absolute;
      right: -120px;
      bottom: -170px;
      width: 330px;
      height: 330px;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 50%;
      box-shadow: 0 0 0 38px rgba(255,255,255,.05), 0 0 0 76px rgba(255,255,255,.04);
    }

    .contact-copy,
    .contact-details {
      position: relative;
      z-index: 1;
    }

    .contact-box h2 {
      margin: 0 0 12px;
      font-size: clamp(30px, 4vw, 44px);
      letter-spacing: -1.5px;
    }

    .contact-box p {
      max-width: 590px;
      margin: 0;
      color: rgba(255,255,255,.9);
      font-size: 14px;
      line-height: 1.9;
    }

    .contact-details {
      display: grid;
      gap: 14px;
    }

    .contact-item {
      display: block;
      padding: 18px 20px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 18px;
      color: white;
      text-decoration: none;
      background: rgba(255,255,255,.12);
      transition: transform .25s ease, background .25s ease;
    }

    .contact-item:hover {
      transform: translateY(-4px);
      background: rgba(255,255,255,.2);
    }

    .contact-item span {
      display: block;
      margin-bottom: 5px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.3px;
      opacity: .75;
      text-transform: uppercase;
    }

    .contact-item strong {
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .canopy {
      position: fixed;
      z-index: -1;
      top: -35px;
      width: 240px;
      height: 250px;
      opacity: .35;
      pointer-events: none;
    }

    .canopy::before {
      content: "";
      position: absolute;
      top: 0;
      width: 2px;
      height: 245px;
      background: var(--forest);
      transform: rotate(-32deg);
      transform-origin: top;
    }

    .canopy.right { right: -38px; transform: scaleX(-1); }
    .canopy.left { left: -38px; }

    .canopy i {
      position: absolute;
      width: 48px;
      height: 24px;
      display: block;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(135deg, var(--leaf), var(--sage));
      transform-origin: 8px 20px;
      animation: sway 5s ease-in-out infinite alternate;
    }

    .canopy i:nth-child(1) { top: 26px; left: 68px; transform: rotate(-28deg); }
    .canopy i:nth-child(2) { top: 64px; left: 104px; transform: rotate(20deg); animation-delay: -1.1s; }
    .canopy i:nth-child(3) { top: 104px; left: 48px; transform: rotate(-40deg); animation-delay: -2.2s; }
    .canopy i:nth-child(4) { top: 136px; left: 116px; transform: rotate(18deg); animation-delay: -.5s; }
    .canopy i:nth-child(5) { top: 174px; left: 76px; transform: rotate(-30deg); animation-delay: -1.7s; }

    @keyframes sway {
      from { translate: -2px 0; rotate: -3deg; }
      to { translate: 5px 6px; rotate: 4deg; }
    }

    footer {
      padding: 42px 0 52px;
      color: var(--forest);
      font-size: 12px;
      line-height: 1.9;
      text-align: center;
    }

    @media (max-width: 760px) {
      .topbar { top: 16px; }

      .hero {
        grid-template-columns: 1fr;
        gap: 24px;
        padding-top: 90px;
      }

      .photo-wrap {
        min-height: 380px;
        grid-row: 1;
      }

      .quote { right: 4%; }

      .timeline {
        grid-template-columns: repeat(2, 1fr);
        gap: 24px 10px;
      }

      .timeline::before { display: none; }

      .contact-box { grid-template-columns: 1fr; }

      .visual-river {
        grid-template-columns: 1fr;
        margin-bottom: 0;
      }

      .visual-card,
      .visual-card:nth-child(1),
      .visual-card:nth-child(3) {
        height: 240px;
        margin-top: 0;
      }

      .name span { white-space: normal; }

      .canopy { opacity: .2; }
    }
  </style>
</head>

    let currentLanguage = "vi";
    let currentYear = null;

    const yearButtons = document.querySelectorAll(".year-btn");
    const languageButtons = document.querySelectorAll(".language-btn");

    function renderPage() {
      const text = content[currentLanguage];
      document.documentElement.lang = text.htmlLang;
      document.getElementById("eyebrow").textContent = text.eyebrow;
      document.getElementById("subtitle").textContent = text.subtitle;
      document.getElementById("intro1").textContent = text.intro1;
      document.getElementById("intro2").textContent = text.intro2;
      document.getElementById("quote").textContent = text.quote;
      document.getElementById("journey-eyebrow").textContent = text.journeyEyebrow;
      document.getElementById("journey-title").textContent = text.journeyTitle;
      document.getElementById("journey-lead").textContent = text.journeyLead;
      document.getElementById("contact-title").textContent = text.contactTitle;
      document.getElementById("contact-text").textContent = text.contactText;
      document.getElementById("footer").textContent = text.footer;

      yearButtons.forEach((button) => {
        const year = button.dataset.year;
        button.querySelector(".year-summary").textContent = text.years[year].summary;
      });

      renderYearDetail();
    }

    function renderYearDetail() {
      const detailBox = document.getElementById("year-detail");

      if (!currentYear) {
        detailBox.classList.add("is-hidden");
        detailBox.innerHTML = "";
        return;
      }

      const yearText = content[currentLanguage].years[currentYear];
      detailBox.classList.remove("is-hidden");
      detailBox.innerHTML = "<strong>" + currentYear + " — </strong>" + yearText.detail;
    }

    yearButtons.forEach((button) => {
      button.addEventListener("click", () => {
        yearButtons.forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        currentYear = button.dataset.year;
        renderYearDetail();
      });
    });

    languageButtons.forEach((button) => {
      button.addEventListener("click", () => {
        languageButtons.forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        currentLanguage = button.dataset.lang;
        renderPage();
      });
    });

    renderPage();
  </script>
